<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Kayden Ireland">

    <title>{{title}} | Kayden Ireland</title>
    <link rel="stylesheet" href="{{root}}styles/style.css">
</head>
<body>
    <canvas id="bg"></canvas>
    <script type="module" src="{{root}}js/background.js"></script>
    <script type="module" src="{{root}}js/components.js"></script>

    <div id="page-content">

        {{header}}

        <main id="main">

            <br>
            <div id="page-title">{{title}}</div>
            <br>
            <div class="album-date">{{date}}</div>
            <div class="post-tags"># {{location}}</div>
            <br>

            {{content}}

            {{photos}}



        </main>

        {{footer}}

    </div>
</body>
</html>
